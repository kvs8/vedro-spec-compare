openapi: 3.0.1

info:
  title: Cities API
  version: "1.0"

paths:
  /v1/cities:
    get:
      parameters:
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id:
                    type: number
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                city_id:
                  type: number
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id:
                    type: number
                  name:
                    type: string
  /v1/cities/list:
    get:
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id:
                    type: number
                  name:
                    type: string
